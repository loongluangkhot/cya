[project]
name = "cya-server"
version = "0.1.0"
description = "cya server — FastAPI + Socket.IO backend for the cya hangout app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-socketio>=5.11",
  "python-dotenv>=1.0",
  "pywebpush>=2.3.0",
  "feedparser>=6.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
    "python-socketio-stubs>=5.16.0.0.20260117",
]
