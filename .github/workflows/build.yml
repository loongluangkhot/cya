# cya repo: .github/workflows/build.yml
name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (defaults to the branch the workflow is run from)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: cya-frontend
            context: ./frontend
          - name: cya-backend
            context: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # On manual dispatch: use the provided ref if any, otherwise the branch you
          # ran the workflow from. On push: this falls back to the pushed commit.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          tags: |
            # Always tag with the full SHA (immutable, precise)
            type=sha,format=long
            # Tag with the branch name for branch builds (e.g. ":feature-foo")
            type=ref,event=branch
            # Tag :latest ONLY for main builds — never for feature branches
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Write frontend .env file
        run: |
          cat > frontend/.env << 'EOF'
          ${{ vars.FRONTEND_ENV }}
          EOF

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max