# cya repo: docker-compose.yml
services:
  cya-frontend:
    image: ${DOCKERHUB_USERNAME}/cya-frontend:${CYA_TAG:-latest}
    restart: unless-stopped
    networks:
      - internal
      - edge
    depends_on:
      - cya-backend
    labels:
      caddy: ${CYA_FRONTEND_HOST}
      caddy.reverse_proxy: "{{upstreams 3001}}"

  cya-backend:
    image: ${DOCKERHUB_USERNAME}/cya-backend:${CYA_TAG:-latest}
    restart: unless-stopped
    # Give the SIGTERM-only room snapshot a real window to flush before
    # Docker escalates to SIGKILL. Default is 10s, which is tight once
    # audio_blobs in active rooms approach the per-room cap.
    stop_grace_period: 30s
    volumes:
      - ./backend/.env:/app/.env:ro
      # SIGTERM-only room snapshot lives here so a redeploy doesn't
      # evict active sessions. Bind-mounted from the host so it survives
      # container replacement.
      - ./backend/data:/app/data
    networks:
      - internal
      - edge
    labels:
      caddy: ${CYA_BACKEND_HOST}
      caddy.reverse_proxy: "{{upstreams 8001}}"

networks:
  internal:
  edge:  # so Caddy can reach it
    external: true
    name: ${EXTERNAL_EDGE_NETWORK:-edge}