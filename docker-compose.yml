# cya repo: docker-compose.yml
services:
  cya-frontend:
    image: ${DOCKERHUB_USERNAME}/cya-frontend:${CYA_TAG:-latest}
    restart: unless-stopped
    networks:
      - internal
      - edge
    depends_on:
      - cya-backend
    labels:
      caddy: ${CYA_FRONTEND_HOST}
      caddy.reverse_proxy: "{{upstreams 3001}}"

  cya-backend:
    image: ${DOCKERHUB_USERNAME}/cya-backend:${CYA_TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./backend/.env:/app/.env:ro
    networks:
      - internal
      - edge
    labels:
      caddy: ${CYA_BACKEND_HOST}
      caddy.reverse_proxy: "{{upstreams 8001}}"

networks:
  internal:
  edge:  # so Caddy can reach it
    external: true
    name: ${EXTERNAL_EDGE_NETWORK:-edge}